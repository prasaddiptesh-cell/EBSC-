# Builds the Easy Buys Android app (.apk) on GitHub's free servers.
# Upload app.zip to the top of the repository; every upload starts a build (about 20 minutes).
# When it shows a green tick: Releases › "Latest app – Easy Buys" › tap the .apk on the tablet or phone.
# It installs over the Bakery app and keeps all its data (same app id and signature).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unpack the app
        working-directory: .
        run: |
          ZIP=$(ls EasyBuys.zip app.zip BakeryManager.zip 2>/dev/null | head -1)
          test -n "$ZIP" || { echo "Upload EasyBuys.zip to the top of the repository"; exit 1; }
          echo "Building from $ZIP"
          rm -rf app /tmp/unz && unzip -q -o "$ZIP" -d /tmp/unz
          if [ -f /tmp/unz/package.json ]; then mv /tmp/unz app; else mv "$(dirname "$(ls /tmp/unz/*/package.json | head -1)")" app; fi
          test -f app/package.json || { echo "The zip has no package.json"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app libraries
        run: |
          npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          npx expo install --fix || true
          # The face engine and its model files come from this package – make sure it is really there.
          if [ ! -s node_modules/@vladmandic/face-api/model/face_recognition_model.bin ]; then
            echo "Face engine package missing – installing it again"
            npm install --no-audit --no-fund --no-save @vladmandic/face-api@1.7.15 || npm install --no-audit --no-fund --no-save --legacy-peer-deps @vladmandic/face-api@1.7.15
          fi
          ls -la node_modules/@vladmandic/face-api/model/ | head -20 || true

      - name: Run the checks (upgrade from Bakery, Time Clock, timesheets, leave, sync, device linking, cloud)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            # Any failing check is also shown as an annotation on the build (readable without the full log).
            set +e
            npm test 2>&1 | tee test-output.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              grep -nE "^FAIL|FAILED|Error|Assertion|at file" test-output.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
              exit "$status"
            fi
          else
            echo "No npm test script found in package.json; skipping automated tests."
          fi

      - name: Check the face engine in Chrome (information only)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ ! -f "./plugins/withFaceAssets.js" ] && [ ! -f "./plugins/withFaceAssets.cjs" ] && [ ! -f "./plugins/withFaceAssets.mjs" ]; then
            echo "Face engine plugin not present in this app package; skipping Chrome face-engine check."
            exit 0
          fi
          node -e "require('./plugins/withFaceAssets').copyFaceFiles(process.cwd(), '/tmp/fe')"
          google-chrome --headless=new --no-sandbox --allow-file-access-from-files --virtual-time-budget=120000 --dump-dom "file:///tmp/fe/app/src/main/assets/face/index.html?selftest" > /tmp/dom.txt 2>/dev/null || true
          grep -o '<pre class="msg">[^<]*' /tmp/dom.txt || echo "No answer from the face engine"
          grep -q '"reason":"no_face"' /tmp/dom.txt && echo "FACE ENGINE OK" || echo "Face engine self-test did not return no_face; continuing."

      - name: Check the app code
        run: npx expo export --platform android --output-dir /tmp/check 2>&1 | tail -40; exit ${PIPESTATUS[0]}

      - name: Build the apk
        env:
          EB_KEYSTORE_B64: ${{ secrets.EB_KEYSTORE_B64 }}
          EB_KEYSTORE_PASS: ${{ secrets.EB_KEYSTORE_PASS }}
          EB_KEY_ALIAS: ${{ secrets.EB_KEY_ALIAS }}
        run: |
          CI=1 npx expo prebuild --platform android --clean --no-install
          # Make sure the face engine is inside the app (copy it again if the build step missed it).
          if [ ! -s android/app/src/main/assets/face/model/face_recognition_model.bin ]; then
            echo "Face engine not packed by prebuild – copying it now"
            node -e "require('./plugins/withFaceAssets').copyFaceFiles(process.cwd(), 'android')" || true
          fi
          if [ -s android/app/src/main/assets/face/model/face_recognition_model.bin ]; then
            echo "Face engine model found."
            echo "FACE=ok" >> "$GITHUB_ENV"
          else
            echo "::warning::Face engine files are NOT in this app – the face check will not work on this build."
            echo "FACE=missing" >> "$GITHUB_ENV"
          fi
          ls -la android/app/src/main/assets/face android/app/src/main/assets/face/model || true
          # Smaller app: one apk per kind of processor instead of one big apk with all of them (and no emulator code).
          # The normal apk is for 64-bit tablets and phones; the "-32bit" one is only for older devices that cannot install it.
          printf '\nandroid {\n  splits {\n    abi {\n      enable true\n      reset()\n      include "arm64-v8a", "armeabi-v7a"\n      universalApk false\n    }\n  }\n}\n' >> android/app/build.gradle
          # The shop's own signing key (GitHub › Settings › Secrets › Actions: EB_KEYSTORE_B64, EB_KEYSTORE_PASS, EB_KEY_ALIAS).
          # Without it the app is signed with the public test key – anyone could build an app that installs over it.
          if [ -n "$EB_KEYSTORE_B64" ] && [ -n "$EB_KEYSTORE_PASS" ]; then
            echo "$EB_KEYSTORE_B64" | base64 -d > android/app/easybuys-release.jks
            printf '\nandroid {\n  signingConfigs {\n    easybuys {\n      storeFile file("easybuys-release.jks")\n      storePassword System.getenv("EB_KEYSTORE_PASS")\n      keyAlias (System.getenv("EB_KEY_ALIAS") ?: "easybuys")\n      keyPassword System.getenv("EB_KEYSTORE_PASS")\n    }\n  }\n  buildTypes { release { signingConfig signingConfigs.easybuys } }\n}\n' >> android/app/build.gradle
            echo "SIGNED=shop" >> "$GITHUB_ENV"
          else
            echo "::warning::The shop's signing key is not set up yet (GitHub secrets EB_KEYSTORE_B64 / EB_KEYSTORE_PASS) – this app is signed with the public test key."
            echo "SIGNED=test" >> "$GITHUB_ENV"
          fi
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          rm -f app/easybuys-release.jks
          # check which key signed it
          APKS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          if [ -x "$APKS" ]; then "$APKS" verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk | grep -i "SHA-256" | head -1 | tee /tmp/cert.txt; fi
          if [ "$SIGNED" = "shop" ] && ! grep -qi "e2f8066179d9a6457a5746f8966338f47ab9d3f0c7fd3861e70119d323b39341" /tmp/cert.txt; then echo "::error::The app is not signed with the shop's key"; exit 1; fi

      - name: Publish the apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          NAME="EasyBuys-v${VERSION}-build${CODE}.apk"
          NAME32="EasyBuys-v${VERSION}-build${CODE}-32bit.apk"
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "../$NAME"
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "../$NAME32"
          cd ..
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$NAME" "$NAME32" --title "Latest app – Easy Buys v${VERSION} (build ${CODE})" --notes "Open this page on the tablet or phone and tap the .apk to install (if Android says the app is not compatible, use the -32bit one instead). It updates the Bakery app in place and keeps all data. Face check: ${FACE:-unknown}. Signed with: ${SIGNED:-test} key."

      - name: Keep a copy for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: easy-buys-apk
          path: EasyBuys-*.apk
          retention-days: 30
