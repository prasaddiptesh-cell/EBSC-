# Builds the Easy Buys Aronium Link for the till PCs (Windows .exe) from EasyBuys.zip.
# When it shows a green tick: Releases › "Aronium Link for Windows" › download the .zip on each till PC.
# The link only READS Aronium - it never changes anything in Aronium.
name: Build Windows Aronium Link

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["EasyBuys.zip", "AroniumLink.zip", ".github/workflows/build-windows-link.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unpack the link (AroniumLink.zip, else EasyBuys.zip)
        shell: pwsh
        run: |
          $zip = if (Test-Path AroniumLink.zip) { 'AroniumLink.zip' } else { 'EasyBuys.zip' }
          Write-Host "Building from $zip"
          Expand-Archive -Path $zip -DestinationPath unz -Force
          $src = Get-ChildItem -Path unz -Recurse -Directory -Filter aronium-bridge | Select-Object -First 1
          if (-not $src) { Write-Error "tools/aronium-bridge is not in EasyBuys.zip"; exit 1 }
          Move-Item $src.FullName link

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Stamp the version and build number
        working-directory: link
        run: python tests\stamp_build.py ${{ github.run_number }} ${{ github.sha }}

      - name: Run the checks
        working-directory: link
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt
          exit $code

      - name: Picture of the window (for checking the look)
        working-directory: link
        continue-on-error: true
        run: |
          python -m pip install pillow
          python tests\preview_ui.py window-preview.png

      - name: Keep the picture and test output (branch link-preview)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP\pv | Out-Null
          Copy-Item link\window-preview*.png $env:RUNNER_TEMP\pv\ -ErrorAction SilentlyContinue
          Copy-Item link\test-output.txt $env:RUNNER_TEMP\pv\ -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem $env:RUNNER_TEMP\pv)) { exit 0 }
          Set-Location $env:RUNNER_TEMP\pv
          git init -q
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git add -A; git commit -qm "Window preview, build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/link-preview

      - name: Build the program
        working-directory: link
        run: |
          python -m pip install --upgrade pip pyinstaller
          $icon = if (Test-Path assets\icon.ico) { @('--icon', 'assets\icon.ico', '--add-data', 'assets;assets') } else { @() }
          if (Test-Path version.txt) { $icon += @('--version-file', 'version.txt') }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EasyBuysAroniumLink @icon app.py

      - name: Check the program starts (no window)
        working-directory: link
        shell: pwsh
        run: |
          $env:EASYBUYS_LINK_HOME = "$env:RUNNER_TEMP\linkhome"
          $p = Start-Process -FilePath dist\EasyBuysAroniumLink.exe -ArgumentList "--check" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error "The program did not finish its check within 90 seconds"; exit 1 }
          Write-Host "check exit code: $($p.ExitCode) (1 = settings not filled in yet, which is expected here)"
          if (Test-Path "$env:EASYBUYS_LINK_HOME\crash.log") { Get-Content "$env:EASYBUYS_LINK_HOME\crash.log"; Write-Error "The program crashed"; exit 1 }
          if ($p.ExitCode -gt 1) { Write-Error "The program did not start properly"; exit 1 }

      - name: Make the installer
        working-directory: link
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "Inno Setup not found"; exit 1 }
          $ver = (python -c "import build_info; print(build_info.VERSION)").Trim()
          & $iscc.FullName "/DAppVersion=$ver" "/DBuild=${{ github.run_number }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item output\EasyBuysAroniumLink-Setup.exe

      - name: Check the installer (install, start, uninstall)
        working-directory: link
        shell: pwsh
        run: |
          $p = Start-Process -FilePath output\EasyBuysAroniumLink-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "install exit code $($p.ExitCode)"; exit 1 }
          $exe = Join-Path $env:ProgramFiles 'Easy Buys\Aronium Link\EasyBuysAroniumLink.exe'
          if (-not (Test-Path $exe)) { Write-Error "not installed at $exe"; exit 1 }
          $reg = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'Easy Buys Aronium Link' }
          if (-not $reg) { Write-Error "not in the Apps list"; exit 1 }
          Write-Host "Apps list: $($reg.DisplayName) $($reg.DisplayVersion) by $($reg.Publisher)"
          $env:EASYBUYS_LINK_HOME = "$env:RUNNER_TEMP\linkhome2"
          $c = Start-Process -FilePath $exe -ArgumentList '--check' -PassThru
          if (-not $c.WaitForExit(90000)) { Write-Error "installed copy did not finish its check"; exit 1 }
          if ($c.ExitCode -gt 1) { Write-Error "installed copy did not start properly"; exit 1 }
          # install again over the top (an update)
          $p = Start-Process -FilePath output\EasyBuysAroniumLink-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "update install exit code $($p.ExitCode)"; exit 1 }
          $un = Join-Path $env:ProgramFiles 'Easy Buys\Aronium Link\unins000.exe'
          $u = Start-Process -FilePath $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { Write-Error "uninstall left the program behind"; exit 1 }
          Write-Host "install, update and uninstall all fine"

      - name: Package and publish
        working-directory: link
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist\EasyBuysAroniumLink.exe pkg\
          Copy-Item README.md pkg\ -ErrorAction SilentlyContinue
          Compress-Archive -Path pkg\* -DestinationPath EasyBuysAroniumLink-Windows.zip -Force
          gh release delete link-latest --yes --cleanup-tag 2>$null
          $ver = (python -c "import build_info; print(build_info.VERSION)").Trim()
          Copy-Item output\EasyBuysAroniumLink-Setup.exe .
          gh release create link-latest EasyBuysAroniumLink-Setup.exe EasyBuysAroniumLink-Windows.zip --title "Aronium Link for Windows (till PCs) - version $ver build ${{ github.run_number }}" --notes "On each till PC: download EasyBuysAroniumLink-Setup.exe and run it (Windows may say 'unknown publisher': More info > Run anyway). It shows in Settings > Apps with Uninstall. It only reads Aronium - it never changes Aronium. The .zip is the same program without an installer."
