# Builds the Easy Buys Aronium Link for the till PCs (Windows .exe) from EasyBuys.zip.
# When it shows a green tick: Releases › "Aronium Link for Windows" › download the .zip on each till PC.
# The link only READS Aronium - it never changes anything in Aronium.
name: Build Windows Aronium Link

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["EasyBuys.zip", "AroniumLink.zip", ".github/workflows/build-windows-link.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unpack the link (AroniumLink.zip, else EasyBuys.zip)
        shell: pwsh
        run: |
          $zip = if (Test-Path AroniumLink.zip) { 'AroniumLink.zip' } else { 'EasyBuys.zip' }
          Write-Host "Building from $zip"
          Expand-Archive -Path $zip -DestinationPath unz -Force
          $src = Get-ChildItem -Path unz -Recurse -Directory -Filter aronium-bridge | Select-Object -First 1
          if (-not $src) { Write-Error "tools/aronium-bridge is not in EasyBuys.zip"; exit 1 }
          Move-Item $src.FullName link

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Stamp the version and build number
        working-directory: link
        run: python tests\stamp_build.py ${{ github.run_number }} ${{ github.sha }}

      - name: Run the checks
        working-directory: link
        run: python -m unittest discover -s tests -v

      - name: Picture of the window (for checking the look)
        working-directory: link
        continue-on-error: true
        run: |
          python -m pip install pillow
          python tests\preview_ui.py window-preview.png

      - name: Keep the picture
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: window-preview
          path: link/window-preview.png
          if-no-files-found: ignore

      - name: Build the program
        working-directory: link
        run: |
          python -m pip install --upgrade pip pyinstaller
          $icon = if (Test-Path assets\icon.ico) { @('--icon', 'assets\icon.ico', '--add-data', 'assets;assets') } else { @() }
          if (Test-Path version.txt) { $icon += @('--version-file', 'version.txt') }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EasyBuysAroniumLink @icon app.py

      - name: Check the program starts (no window)
        working-directory: link
        shell: pwsh
        run: |
          $env:EASYBUYS_LINK_HOME = "$env:RUNNER_TEMP\linkhome"
          $p = Start-Process -FilePath dist\EasyBuysAroniumLink.exe -ArgumentList "--check" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Error "The program did not finish its check within 90 seconds"; exit 1 }
          Write-Host "check exit code: $($p.ExitCode) (1 = settings not filled in yet, which is expected here)"
          if (Test-Path "$env:EASYBUYS_LINK_HOME\crash.log") { Get-Content "$env:EASYBUYS_LINK_HOME\crash.log"; Write-Error "The program crashed"; exit 1 }
          if ($p.ExitCode -gt 1) { Write-Error "The program did not start properly"; exit 1 }

      - name: Package and publish
        working-directory: link
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist\EasyBuysAroniumLink.exe pkg\
          Copy-Item README.md pkg\ -ErrorAction SilentlyContinue
          Compress-Archive -Path pkg\* -DestinationPath EasyBuysAroniumLink-Windows.zip -Force
          gh release delete link-latest --yes --cleanup-tag 2>$null
          $ver = (python -c "import build_info; print(build_info.VERSION)").Trim()
          gh release create link-latest EasyBuysAroniumLink-Windows.zip --title "Aronium Link for Windows (till PCs) - version $ver build ${{ github.run_number }}" --notes "Download on each till PC, unzip, open EasyBuysAroniumLink.exe and follow the steps in the window. It only reads Aronium - it never changes Aronium."
