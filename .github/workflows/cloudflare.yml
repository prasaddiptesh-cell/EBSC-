# The Easy Buys cloud on Cloudflare (Easy Buys' own account – never Vukavata's).
# Runs when the branch "cf-ops" is pushed (or by hand). The file cf-ops.txt on that branch says what to do, one per line:
#   deploy  – build the cloud program from cloud/Code.gs (inside EasyBuys.zip) and put it on Cloudflare
#   status  – what the Cloudflare cloud holds (sheets and rows, copies waiting for Google)
#   import  – copy the data from the Google cloud (every sheet and the script properties) – before the switch only
#   send    – send the copies waiting for Google now
#   compare – every sheet's rows here against Google's now
#   open    – after the LAST import: devices may use the Cloudflare cloud (imports are refused from then on)
#   tenants – the list of businesses on the cloud (plan and licence only)
# GitHub secrets: CLOUDFLARE_API_TOKEN, RELAY_KEY (also in the Google script's properties), GOOGLE_URL (…/exec).
# ADMIN_KEY is made new on every run, so nobody has to keep it. Nothing secret is printed (this repository is public).
name: Easy Buys cloud on Cloudflare
on:
  push:
    branches: [cf-ops]
  workflow_dispatch:
jobs:
  cloud:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d06406ec1740e1ac63b8b8c02d500c1e
      RELAY_KEY: ${{ secrets.RELAY_KEY }}
      GOOGLE_URL: ${{ secrets.GOOGLE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Durable Objects use (rows written per hour, last 30 hours – numbers only)
        continue-on-error: true
        run: |
          since=$(date -u -d '-30 hours' +%Y-%m-%dT%H:00:00Z); until=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q="{\"query\":\"{ viewer { accounts(filter:{accountTag:\\\"$CLOUDFLARE_ACCOUNT_ID\\\"}) { durableObjectsPeriodicGroups(limit:200, filter:{datetimeHour_geq:\\\"$since\\\", datetimeHour_leq:\\\"$until\\\"}, orderBy:[datetimeHour_ASC]) { dimensions { datetimeHour namespaceId } sum { rowsWritten rowsRead storageWriteUnits activeTime } } } } }\"}"
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$q" https://api.cloudflare.com/client/v4/graphql \
            | jq -c '.errors // (.data.viewer.accounts[0].durableObjectsPeriodicGroups[] | {h: .dimensions.datetimeHour, ns: (.dimensions.namespaceId[0:6]), w: .sum.rowsWritten, r: .sum.rowsRead, at: .sum.activeTime, wu: .sum.storageWriteUnits})'
      - name: The app source (EasyBuys.zip)
        run: |
          mkdir -p app && cd app && unzip -q ../EasyBuys.zip
          test -f cloudflare/wrangler.toml || { echo "::error::No cloudflare/ in EasyBuys.zip"; exit 1; }
          ACTIONS=$(tr -d '\r' < ../cf-ops.txt 2>/dev/null | grep -E '^[a-z]+' | tr '\n' ' ')
          echo "ACTIONS=${ACTIONS:-deploy status}" >> "$GITHUB_ENV"
          echo "To do: ${ACTIONS:-deploy status}"
      - name: Checks before anything goes up
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::The secret CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          if [ ${#RELAY_KEY} -lt 24 ]; then echo "::warning::RELAY_KEY is missing or short – the bridge to Google stays off"; fi
          test -n "$GOOGLE_URL" || echo "::warning::GOOGLE_URL is missing – the bridge to Google stays off"
          cd app && node cloudflare/tools/build-cloud.mjs
          # the cloud program must be the one that was tested: the Cloudflare tests in Node
          CLOUD_IMPL=cf node tests/cloud.test.js | tail -1
          CLOUD_IMPL=cf node tests/cloud19.test.js | tail -1
          CLOUD_IMPL=cf node tests/cloud21.test.js | tail -1
          node tests/tenants.test.js | tail -1
      - name: The workers.dev address (made once)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for name in easybuys easybuys-fiji easybuys-cloud-fj; do
              r=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "{\"subdomain\":\"$name\"}" "$api")
              echo "$r" | jq -c '{success, errors}'
              if [ "$(echo "$r" | jq -r .success)" = "true" ]; then SUB=$name; break; fi
            done
          fi
          test -n "$SUB" || { echo "::error::No workers.dev address – open Workers & Pages once in the Cloudflare dashboard"; exit 1; }
          echo "Address: $SUB.workers.dev"
      - name: Deploy
        if: contains(env.ACTIONS, 'deploy')
        working-directory: app/cloudflare
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | grep -v -i "token" | tail -25
      - name: Keys
        working-directory: app/cloudflare
        run: |
          ADMIN_KEY=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")
          echo "::add-mask::$ADMIN_KEY"
          echo "ADMIN_KEY=$ADMIN_KEY" >> "$GITHUB_ENV"
          PROVIDER_KEY=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")
          echo "::add-mask::$PROVIDER_KEY"
          echo "PROVIDER_KEY=$PROVIDER_KEY" >> "$GITHUB_ENV"
          ADMIN_KEY_NEW=$ADMIN_KEY PROVIDER_KEY_NEW=$PROVIDER_KEY node -e "
            const o = { ADMIN_KEY: process.env.ADMIN_KEY_NEW, PROVIDER_KEY: process.env.PROVIDER_KEY_NEW };
            if ((process.env.RELAY_KEY || '').length >= 24) o.RELAY_KEY = process.env.RELAY_KEY;
            if (process.env.GOOGLE_URL) o.GOOGLE_URL = process.env.GOOGLE_URL;
            require('fs').writeFileSync('/tmp/secrets.json', JSON.stringify(o));
            console.log('Keys set:', Object.keys(o).join(', '));
          " 
          set -o pipefail
          npx --yes wrangler@4 secret bulk /tmp/secrets.json 2>&1 | grep -v -i "token" | tail -5
          rm -f /tmp/secrets.json
      - name: The address
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          test -n "$SUB" || { echo "::error::No workers.dev address yet – open Workers & Pages once in the Cloudflare dashboard"; exit 1; }
          URL="https://easybuys-cloud.$SUB.workers.dev"
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "The Easy Buys cloud on Cloudflare: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
          # a new address takes a few minutes to work everywhere
          for i in $(seq 1 30); do H=$(curl -s -m 10 "$URL/health" || true); if echo "$H" | grep -q '"ok":true'; then break; fi; sleep 10; done
          echo "health: ${H:-no answer yet}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Status / import / send
        run: |
          sleep 20 # new keys take a few seconds to reach every Cloudflare location
          ask() { curl -s -m 900 -X POST -H 'Content-Type: text/plain;charset=utf-8' --data "{\"kind\":\"$1\",\"adminKey\":\"$ADMIN_KEY\"}" "$URL"; }
          for a in $ACTIONS; do
            case "$a" in
              import) echo "== import (in batches)"
                first=true
                for n in $(seq 1 300); do
                  body="{\"kind\":\"cf_import\",\"adminKey\":\"$ADMIN_KEY\",\"restart\":$first}"; first=false
                  r=$(curl -s -m 900 -X POST -H 'Content-Type: text/plain;charset=utf-8' --data "$body" "$URL")
                  echo "$r" | jq -c '{ok, error, done, at, of, props, sheets: [.sheets[]? | "\(.name) \(.rows)"]}'
                  [ "$(echo "$r" | jq -r .ok)" = "true" ] || break
                  [ "$(echo "$r" | jq -r .done)" = "true" ] && break
                done ;;
              compare) echo "== compare (rows here vs Google now)"; ask cf_compare | jq -c . ;;
              open) echo "== open (devices welcome from now; no more imports)"; ask cf_open | jq -c . ;;
              send) echo "== send"; ask cf_send | jq -c . ;;
              tenants) echo "== businesses"; curl -s -m 60 -X POST -H 'Content-Type: text/plain;charset=utf-8' --data "{\"kind\":\"tenant_list\",\"providerKey\":\"$PROVIDER_KEY\"}" "$URL/provider" | jq -c . ;;
              status) echo "== status"; ask cf_status | jq -c '{ok, error, version, refused, waitingForGoogle, imported, open, stats, sheets: [.sheets[]? | "\(.name) \(.rows)"]}' ;;
            esac
          done
