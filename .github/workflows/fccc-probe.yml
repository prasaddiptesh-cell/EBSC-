# Reads the real FCCC price lists the way the app does and saves what it sees in fccc-probe.txt (run by hand).
name: FCCC probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd tools && npm init -y >/dev/null && npm i pdf-lib@1.17.1 >/dev/null
          node fccc-probe.mjs
          mv fccc-probe.txt ../fccc-probe.txt
      - run: |
          git config user.name "fccc-probe" && git config user.email "probe@users.noreply.github.com"
          git add fccc-probe.txt && git commit -m "FCCC probe output [skip ci]" && git push
