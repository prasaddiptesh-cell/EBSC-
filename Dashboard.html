<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --red:#DA2A2F; --blue:#2F5FC4; --ink:#2B1A1C; --bg:#F5F1EA; --card:#fff; --line:#E7E0D5; --sub:#6E6255; --good:#157F3B; --warn:#B45309; --bad:#B42318; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#fff; border-bottom:4px solid var(--red); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header img { height:46px; background:#fff; border-radius:8px; padding:2px 4px; }
  .live { font-size:13px; color:var(--sub); text-align:right; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:5px; margin-right:6px; vertical-align:middle; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  .grid { display:grid; gap:14px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .kpi { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--red); border-radius:12px; padding:12px 14px; }
  .kpi .l { font-size:12px; color:var(--sub); text-transform:uppercase; letter-spacing:.4px; }
  .kpi .v { font-size:26px; font-weight:800; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:14px; }
  h2 { margin:0 0 10px; font-size:17px; color:var(--blue); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; color:#5E320C; background:#F6E7D6; padding:7px 8px; }
  td { padding:7px 8px; border-bottom:1px solid #F0EBE3; vertical-align:top; }
  .tag { display:inline-block; padding:2px 9px; border-radius:10px; font-size:12px; font-weight:700; color:#fff; }
  .muted { color:var(--sub); }
  .batch { border:2px solid var(--line); border-radius:12px; padding:10px 12px; }
  .batch.over { border-color:var(--bad); background:#FDF1EF; }
  .batches { display:grid; gap:10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .scroll { overflow-x:auto; }
  #login { max-width:360px; margin:60px auto; background:#fff; border-radius:16px; padding:24px; border:1px solid var(--line); text-align:center; }
  #login input { width:100%; font-size:18px; padding:12px; border:2px solid var(--line); border-radius:10px; margin:14px 0; }
  button { background:var(--red); color:#fff; border:0; font-size:17px; font-weight:700; padding:12px 18px; border-radius:10px; cursor:pointer; width:100%; }
  .err { color:var(--bad); font-weight:700; min-height:20px; }
  .two { display:grid; gap:14px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .two { grid-template-columns: 1fr 1fr; } }
  a { color:var(--blue); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { width:auto; background:#fff; color:var(--ink); border:2px solid var(--line); font-size:14px; padding:9px 12px; }
  .chip.on { background:var(--red); color:#fff; border-color:var(--red); }
  .qty { width:110px; font-size:18px; font-weight:700; padding:8px 10px; border:2px solid var(--line); border-radius:8px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; align-items:center; }
  .by { flex:1; min-width:180px; font-size:16px; padding:11px; border:2px solid var(--line); border-radius:10px; }
  button.sm { width:auto; font-size:16px; padding:12px 18px; }
  button.ghost { background:#fff; color:var(--red); border:2px solid var(--red); }
  .pstatus { margin-top:10px; min-height:20px; font-size:14px; }
  /* v3.9.4 the app decides the sections (snapshot.board) */
  .tabs { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; -webkit-overflow-scrolling:touch; }
  .tab { flex:0 0 auto; width:auto; background:var(--card); color:var(--ink); border:2px solid var(--line); font-size:15px; padding:9px 14px; border-radius:22px; }
  .tab.on { background:var(--red); color:#fff; border-color:var(--red); }
  .tab .badge { display:inline-block; min-width:20px; padding:1px 6px; border-radius:10px; font-size:12px; margin-left:6px; color:#fff; }
  .tone-danger { color:var(--bad) !important; } .tone-warn { color:var(--warn) !important; } .tone-ok { color:var(--good) !important; }
  .kpi.t-danger { border-left-color:var(--bad); } .kpi.t-warn { border-left-color:var(--warn); } .kpi.t-ok { border-left-color:var(--good); }
  .kpi .s { font-size:13px; color:var(--sub); margin-top:3px; }
  .li { display:flex; gap:10px; align-items:flex-start; padding:10px 4px; border-bottom:1px solid var(--line); border-left:4px solid transparent; padding-left:10px; }
  .li.t-danger { border-left-color:var(--bad); } .li.t-warn { border-left-color:var(--warn); } .li.t-ok { border-left-color:var(--good); }
  .li .main { flex:1; min-width:0; } .li .t { font-weight:700; } .li .sub { color:var(--sub); font-size:13px; margin-top:2px; }
  .li .amt { font-weight:800; white-space:nowrap; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .tools input, .tools select { font-size:15px; padding:9px 10px; border:2px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  .tools input { flex:1; min-width:160px; }
  tr.t-danger td { color:var(--bad); } tr.t-warn td { color:var(--warn); } tr.t-muted td { color:var(--sub); text-decoration:line-through; } tr.t-ok td:first-child { color:var(--good); }
  td.r, th.r { text-align:right; white-space:nowrap; }
  .note { padding:10px 12px; border-radius:10px; background:var(--bg); color:var(--sub); font-size:14px; margin-top:10px; }
  .note.t-warn { color:var(--warn); } .note.t-ok { color:var(--good); }
  .delta { font-weight:800; white-space:nowrap; } .delta.up { color:var(--good); } .delta.down { color:var(--bad); }
  .spark { width:100%; height:30px; margin-top:6px; display:block; }
  .strip { padding-bottom:16px; } .strip .grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; } .strip .kpi .v { font-size:21px; }
  .bars svg { width:100%; height:auto; display:block; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--sub); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .more { width:auto; margin-top:10px; background:var(--card); color:var(--blue); border:2px solid var(--line); font-size:14px; padding:8px 14px; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#ECE6DF; --bg:#16130F; --card:#221E19; --line:#3A332B; --sub:#B3A797; --blue:#8DB0F5; --good:#5FCB88; --warn:#F0A955; --bad:#FF7A70; }
    header, .tabs { background:var(--card); }
    th { background:#3A2C1E; color:#F3DCC2; } td { border-bottom-color:var(--line); }
    #login { background:var(--card); } .kpi .v { color:var(--ink) !important; }
  }
</style>
</head>

<div id="login">
  <h2 style="color:var(--ink)">Easy Buys Business Dashboard</h2>
  <div class="muted">Enter the dashboard password</div>
  <input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')go()">

<main id="main" style="display:none"><div id="boardArea"></div><div id="legacy"><div id="liveArea"></div><div id="planArea"></div><div id="restArea"></div></div><div id="footArea"></div></main>
<script>
var PW = '';
// 1.0.0 build 1: the password is kept only while the page is open (never saved in the browser).
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
// ids used inside onclick="…" (from the app's data): letters, digits and - _ . : only.
function sid(s){ return String(s===null||s===undefined?'':s).replace(/[^A-Za-z0-9_.:-]/g,''); }
// HTML made by this page (never the app's data) for a table cell.
function H(h){ return { html: h }; }
function go(){ PW = document.getElementById('pw').value; load(true); }
function load(fromLogin){
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok){ document.getElementById('login').style.display='block'; document.getElementById('main').style.display='none'; if(fromLogin) document.getElementById('err').textContent=r.error||'Wrong password'; return; }
    document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block';
    render(r);
  }).withFailureHandler(function(e){ document.getElementById('live').innerHTML = '<span class="dot" style="background:#B42318"></span>Connection problem – retrying'; }).getDashboard(PW);
}
function ago(iso){ if(!iso) return 'never'; var m=Math.round((Date.now()-new Date(iso).getTime())/60000); return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'; }
function hm(min){ if(min===null||min===undefined) return '—'; var h=Math.floor(min/60), m=min%60; return h? h+'h '+(m<10?'0':'')+m+'m' : m+' min'; }
function render(r){
  var s = r.snapshot, mins = r.receivedAt ? Math.round((Date.now()-new Date(r.receivedAt).getTime())/60000) : 999;
  var col = mins<=3 ? '#157F3B' : mins<=15 ? '#B45309' : '#B42318';
  document.getElementById('live').innerHTML = '<span class="dot" style="background:'+col+'"></span>Last update: <b>'+ago(r.receivedAt)+'</b>' + (mins>15?'<br><span style="color:#B42318">The app has not sent figures for a while (offline?)</span>':'');
  if(!s){ document.getElementById('liveArea').innerHTML = '<div class="card">No data received from the tablet yet.</div>'; document.getElementById('planArea').innerHTML = ''; document.getElementById('restArea').innerHTML = ''; return; }
  var h = '';
  var sh = s.shift;
  h += '<div class="card" style="margin-top:0;border-left:6px solid '+(sh? (sh.statusKey==='open'?'#157F3B':'#B45309') : '#999')+'">';
  h += sh ? '<h2 style="margin:0">'+esc(sh.name)+' shift · '+esc(sh.code)+' <span class="tag" style="background:'+(sh.statusKey==='open'?'#157F3B':'#B45309')+'">'+esc(sh.status)+'</span></h2><div class="muted" style="margin-top:4px">Opened '+esc(sh.openedAt.slice(11,16))+' by '+esc(sh.openedBy)+' · running '+hm(s.minutesSinceShiftOpened)+'</div>'
          : '<h2 style="margin:0">No shift running</h2>';
  h += '</div>';
  var t = s.today;
  h += '<div class="grid" style="margin-top:14px">'
    + kpi('Batches today', t.batches) + kpi('Good production', t.good, '#157F3B') + kpi('Yield', t.yieldPct===null?'—':t.yieldPct+'%', t.yieldPct!==null&&t.yieldPct<95?'#B45309':'#157F3B')
    + kpi('Damaged / rejected', t.lost, t.lost?'#B45309':null) + kpi('Open alerts', s.alerts.length, s.alerts.length?'#B42318':'#157F3B') + kpi('Low stock items', s.lowStock.length, s.lowStock.length?'#B42318':'#157F3B') + '</div>';
  var top = h; h = '';  // the plan editor sits between the headline figures and the details
  h += '<div class="card"><h2>In the oven right now</h2>';
  if(!s.activeBatches.length) h += '<div class="muted">No batches in progress.</div>';
  else { h += '<div class="batches">'; s.activeBatches.forEach(function(b){
    h += '<div class="batch'+(b.overdueMin>0?' over':'')+'"><b style="font-size:16px">'+esc(b.product)+'</b> <span class="muted">'+esc(b.code)+'</span><br>'
      + '<span class="tag" style="background:#2F5FC4">'+esc(b.step)+'</span> since '+esc(b.stepSince)+' ('+hm(b.inStepMin)+')<br>'
      + 'Next: <b>'+esc(b.next)+'</b> at '+esc(b.nextDue) + (b.overdueMin>0?' <b style="color:#B42318">'+esc(b.overdueMin)+' min overdue</b>':'')
      + '<br><span class="muted">'+esc(b.baker)+' · '+esc(b.flourKg)+' kg flour · expect '+esc(b.expected)+(b.cut!==null&&b.cut!==undefined?' · cut '+esc(b.cut):'')+'</span></div>'; });
    h += '</div>'; }
  h += '</div>';
  h += '<div class="two"><div class="card"><h2>Who is on shift</h2>' + table(['Name','Signed on','Signed off','Hours'], s.workers.map(function(w){ return [w.name, w.signedOn, w.signedOff||H('<span class="tag" style="background:#157F3B">ON SHIFT</span>'), hm(w.minutes)]; }), true) + '</div>';
  h += '<div class="card"><h2>Today by product</h2>' + table(['Product','Batches','Good','Expected','Yield'], t.byProduct.map(function(p){ return [p.product, p.batches, p.good, p.expected, p.yieldPct===null?'—':p.yieldPct+'%']; })) + '</div></div>';
  h += '<div class="card"><h2>Open alerts</h2>' + table(['Time','Alert','Details'], s.alerts.map(function(a){ return [a.date.slice(5)+' '+a.time, a.type, a.message]; })) + '</div>';
  h += '<div class="two"><div class="card"><h2>Stock levels</h2>' + table(['Item','In stock','Minimum',''], s.stock.map(function(m){ return [m.name, m.stock+' '+m.unit, m.min||'—', m.low?H('<span class="tag" style="background:#B42318">LOW</span>'):'']; }), true) + '</div>';
  h += '<div class="card"><h2>Purchase orders</h2>' + table(['PO','Supplier','Date','Status'], s.purchaseOrders.map(function(p){ return [p.no, p.supplier, p.date, p.status]; })) + '</div></div>';
  h += '<div class="two"><div class="card"><h2>Recent shifts</h2>' + table(['Date','Shift','Status','Batches'], s.recentShifts.map(function(x){ return [x.date, x.name+' ('+x.code+')', x.status, x.batches]; })) + '</div>';
  h += '<div class="card"><h2>Reports &amp; purchase orders (Google Drive)</h2>' + table(['Type','File',''], (r.files||[]).map(function(f){ return [f.type, f.name, (/^https:\/\/(drive|docs)\.google\.com\//.test(String(f.url||''))?H('<a href="'+esc(f.url)+'" target="_blank" rel="noopener">Open</a>'):'')]; }), true) + '</div></div>';
  var foot = '<p class="muted" style="text-align:center;font-size:12px">'+esc(s.bakery)+' – '+esc(s.location)+' · app v'+esc(s.appVersion)+' · data from '+esc(s.generatedAt)+' · refreshes every 30 seconds</p>';
  document.getElementById('liveArea').innerHTML = top;
  document.getElementById('restArea').innerHTML = h;
  document.getElementById('footArea').innerHTML = foot;
  // v3.9.4 the production plan is changed in the app only (owner: the dashboard is for looking).

// ------------------------------------------------ production plan (can be changed from here)
var PLAN = { date: null, dirty: false, values: {}, saving: false, justSaved: null, r: null };
function planFor(r, date){
  var p = (r.pendingPlans||[]).filter(function(x){ return x.date===date; }).pop();
  if(p) return { items: p.items, pending: p };
  var d = (r.snapshot.plans||[]).filter(function(x){ return x.date===date; })[0];
  return { items: d ? d.items : {}, pending: null };
}
function dayLabel(date, today){
  var d = new Date(date+'T12:00:00'), names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var t = new Date(today+'T12:00:00'), diff = Math.round((d-t)/86400000);
  return (diff===0?'Today':diff===1?'Tomorrow':diff===-1?'Yesterday':names[d.getDay()]) + ' ' + date.slice(8,10)+'/'+date.slice(5,7);
}
function renderPlan(r){
  PLAN.r = r;
  var area = document.getElementById('planArea'), s = r.snapshot;
  if(!s || !s.plans || !s.products){ area.innerHTML = ''; return; }
  var dates = s.plans.map(function(p){ return p.date; });
  if(!PLAN.date || dates.indexOf(PLAN.date)<0) PLAN.date = s.today.date;
  var typing = document.activeElement && document.activeElement.tagName==='INPUT' && area.contains(document.activeElement);
  if(PLAN.dirty || PLAN.saving || typing){ planStatus(); return; } // don't overwrite what is being typed
  var cur = planFor(r, PLAN.date);
  PLAN.values = {};
  s.products.forEach(function(p){ var v = cur.items[p.id]; PLAN.values[p.id] = (v===undefined||v===null) ? '' : String(v); });
  var isToday = PLAN.date === s.today.date;
  var made = {}; (s.planToday||[]).forEach(function(x){ made[x.id]=x; });
  var name = ''; try { name = localStorage.getItem('eb_name') || ''; } catch(e) {}
  var h = '<div class="card" id="planCard"><h2>📋 Production plan – change it from here</h2>';
  h += '<div class="chips">' + dates.map(function(d){ return '<button class="chip'+(d===PLAN.date?' on':'')+'" onclick="pickDay(\''+sid(d)+'\')">'+esc(dayLabel(d, s.today.date))+'</button>'; }).join('') + '</div>';
  h += '<div class="scroll"><table><tr><th>Product</th><th>Planned</th>'+(isToday?'<th>Made so far</th>':'')+'</tr>';
  s.products.forEach(function(p){
    var m = made[p.id];
    h += '<tr><td><b>'+esc(p.name)+'</b></td><td><input class="qty" type="number" min="0" step="1" inputmode="numeric" id="plan-'+sid(p.id)+'" value="'+esc(PLAN.values[p.id])+'" oninput="planInput('+(Number(p.id)||0)+', this.value)"> <span class="muted">'+esc(p.unit)+'</span></td>'
      + (isToday ? '<td>'+(m ? esc(m.good)+(m.inProgress?' <span class="muted">(+'+esc(m.inProgress)+' in oven)</span>':'') : '0')+'</td>' : '') + '</tr>';
  });
  h += '</table></div>';
  h += '<div class="row"><input id="planBy" class="by" placeholder="Your name (shown on the tablet)" value="'+esc(name)+'" oninput="try{localStorage.setItem(\'eb_name\', this.value)}catch(e){}">'
    + '<button class="sm ghost" onclick="copyPrev()">Copy previous day</button><button class="sm" id="planSave" onclick="savePlan()">Save plan</button></div>';
  h += '<div id="planStatus" class="pstatus"></div></div>';
  area.innerHTML = h;
  planStatus();
}
function planStatus(){
  var el = document.getElementById('planStatus'); if(!el || !PLAN.r) return;
  var cur = planFor(PLAN.r, PLAN.date), msg = '';
  if(PLAN.saving) msg = '<span class="muted">Saving…</span>';
  else if(PLAN.dirty) msg = '<span style="color:#B45309"><b>Not saved yet</b> – press Save plan.</span>';
  else if(cur.pending) msg = '<span style="color:#B45309">⏳ Saved online – waiting for the bakery tablet to pick it up (it checks every minute while it has internet).</span>';
  else if(PLAN.justSaved === PLAN.date) msg = '<span style="color:#157F3B">✓ The bakery tablet has the new plan.</span>';
  el.innerHTML = msg;
}
function pickDay(d){
  if(PLAN.dirty && !confirm('You have changes that are not saved. Discard them?')) return;
  PLAN.dirty = false; PLAN.date = d; PLAN.justSaved = null; renderPlan(PLAN.r);
}
function planInput(id, v){ PLAN.values[id] = v; PLAN.dirty = true; planStatus(); }
function copyPrev(){
  var s = PLAN.r.snapshot, dates = s.plans.map(function(p){ return p.date; }), i = dates.indexOf(PLAN.date);
  if(i<=0){ alert('There is no earlier day on the list to copy from.'); return; }
  var prev = planFor(PLAN.r, dates[i-1]).items, any = false;
  s.products.forEach(function(p){ var v = prev[p.id]; PLAN.values[p.id] = (v===undefined||v===null)?'':String(v); if(v) any = true; var el=document.getElementById('plan-'+p.id); if(el) el.value = PLAN.values[p.id]; });
  if(!any){ alert('Nothing was planned on '+dayLabel(dates[i-1], s.today.date)+'.'); }
  PLAN.dirty = true; planStatus();
}
function savePlan(){
  var items = {}, bad = false;
  Object.keys(PLAN.values).forEach(function(id){ var v = String(PLAN.values[id]).trim(); if(v==='') return; var n = Number(v); if(!isFinite(n) || n<0) bad = true; else items[id] = n; });
  if(bad){ alert('Please enter numbers of 0 or more.'); return; }
  var by = (document.getElementById('planBy')||{}).value || '';
  PLAN.saving = true; planStatus();
  google.script.run.withSuccessHandler(function(res){
    PLAN.saving = false;
    if(!res || !res.ok){ alert((res && res.error) || 'Could not save'); planStatus(); return; }
    PLAN.dirty = false; PLAN.justSaved = PLAN.date;
    (PLAN.r.pendingPlans = (PLAN.r.pendingPlans||[]).filter(function(x){ return x.date!==PLAN.date; })).push({ seq: res.seq, date: PLAN.date, items: items });
    renderPlan(PLAN.r); load(false);
  }).withFailureHandler(function(e){ PLAN.saving = false; alert('Could not save – check the internet connection. '+(e && e.message ? e.message : '')); planStatus(); })
    .savePlanOnline(PW, PLAN.date, items, by);
}
function kpi(l,v,c){ return '<div class="kpi"><div class="l">'+esc(l)+'</div><div class="v" style="color:'+(c||'#2B1A1C')+'">'+esc(v)+'</div></div>'; }
function table(head, rows, raw){
  if(!rows.length) return '<div class="muted">None</div>';
  return '<div class="scroll"><table><tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>'+rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+(c && typeof c==='object' && typeof c.html==='string' ? c.html : esc(c))+'</td>'; }).join('')+'</tr>'; }).join('')+'</table></div>';
}

// ------------------------------------------------ the business dashboard (v3.9.4): sections sent by the app
var TAB = null; try { TAB = localStorage.getItem('eb_tab'); } catch (e) {}
var BSTATE = {}; // search / filter per table, kept across refreshes
var LASTBOARD = '';
function money(v){ var n = Number(v)||0; var neg = n<0; n = Math.abs(n); var p = n.toFixed(2).split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (neg?'-':'')+'$'+p[0]+'.'+p[1]; }
function tval(v, isMoney){ if(v===null||v===undefined||v==='') return ''; return isMoney ? money(v) : String(v); }
function pickTab(id){ TAB = id; try { localStorage.setItem('eb_tab', id); } catch (e) {} LASTBOARD = ''; renderBoard(LAST_R); window.scrollTo(0,0); }
var LAST_R = null;
function renderBoard(r){
  LAST_R = r;
  var s = r.snapshot, b = s && s.board, tabs = document.getElementById('tabs'), area = document.getElementById('boardArea'), legacy = document.getElementById('legacy');
  if(!b || !b.sections || !b.sections.length){ tabs.style.display='none'; area.innerHTML=''; legacy.style.display='block'; return; }
  var ids = b.sections.map(function(x){ return x.id; });
  if(!TAB || ids.indexOf(TAB)<0) TAB = ids[0];
  tabs.style.display='flex';
  tabs.innerHTML = b.sections.map(function(x){
    var badge = x.badge ? '<span class="badge" style="background:'+(x.badge.tone==='danger'?'var(--bad)':'var(--warn)')+'">'+esc(x.badge.text)+'</span>' : '';
    return '<button class="tab'+(x.id===TAB?' on':'')+'" onclick="pickTab(\''+sid(x.id)+'\')">'+esc(x.icon||'')+' '+esc(x.title)+badge+'</button>'; }).join('');
  var sec = b.sections.filter(function(x){ return x.id===TAB; })[0];
  if(sec.legacy){ area.innerHTML=''; legacy.style.display='block'; return; }
  legacy.style.display='none';
  // Don't redraw while someone is typing in a search box, or when nothing changed.
  var typing = document.activeElement && area.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);
  var sig = TAB+'|'+b.at+'|'+JSON.stringify(BSTATE);
  if(typing || sig===LASTBOARD) return;
  LASTBOARD = sig;
  area.innerHTML = (sec.blocks||[]).map(function(bl, i){ return block(sec.id+'-'+i, bl); }).join('') + '<p class="muted" style="text-align:center;font-size:12px">Worked out by the app at '+esc(b.at)+' · app v'+esc(b.appVersion||'')+'</p>';
}
function block(key, bl){
  if(bl.type==='tiles'){
    var g = '<div class="grid" style="margin-top:'+(bl.title?'4':'14')+'px">'+bl.items.map(function(t){
      var d = (t.delta===null||t.delta===undefined) ? '' : '<span class="delta '+(t.delta>=0?'up':'down')+'">'+(t.delta>=0?'▲ ':'▼ ')+Math.abs(t.delta)+'%</span>'+(t.sub?' · ':'');
      return '<div class="kpi'+(t.tone?' t-'+sid(t.tone):'')+'"><div class="l">'+esc(t.label)+'</div><div class="v'+(t.tone?' tone-'+sid(t.tone):'')+'">'+esc(tval(t.value, t.money))+'</div>'+(d||t.sub?'<div class="s">'+d+esc(t.sub||'')+'</div>':'')+spark(t.spark)+'</div>'; }).join('')+'</div>';
    return bl.title ? '<div class="card strip"><h2>'+esc(bl.title)+'</h2>'+g+'</div>' : g;
  }
  if(bl.type==='note') return '<div class="note t-'+esc(bl.tone||'info')+'">'+esc(bl.text)+'</div>';
  if(bl.type==='list'){
    var h = '<div class="card"><h2>'+esc(bl.title||'')+'</h2>';
    if(!bl.items.length) return h+'<div class="muted">'+esc(bl.empty||'Nothing here.')+'</div></div>';
    h += bl.items.map(function(x){ return '<div class="li'+(x.tone?' t-'+sid(x.tone):'')+'"><div class="main"><div class="t">'+(x.tag?'<span class="tag" style="background:var(--bad);margin-right:6px">'+esc(x.tag)+'</span>':'')+esc(x.text)+'</div>'+(x.sub?'<div class="sub">'+esc(x.sub)+'</div>':'')+'</div>'+(x.right!==null&&x.right!==undefined?'<div class="amt'+(x.tone?' tone-'+sid(x.tone):'')+'">'+esc(tval(x.right, x.money))+'</div>':'')+'</div>'; }).join('');
    return h+'</div>';
  }
  if(bl.type==='table') return tableBlock(key, bl);
  if(bl.type==='bars') return barsBlock(bl);
  return '';
}
function tableBlock(key, bl){
  var st = BSTATE[key] || (BSTATE[key] = { q:'', f:{}, n:100 });
  var rows = bl.rows || [];
  var fcols = bl.cols.filter(function(c){ return c.filter; });
  var shown = rows.filter(function(r){
    for(var k in st.f){ if(st.f[k] && String(r[k])!==st.f[k]) return false; }
    if(st.q){ var q = st.q.toLowerCase(); return bl.cols.some(function(c){ return String(r[c.key]===undefined?'':r[c.key]).toLowerCase().indexOf(q)>=0; }); }
    return true; });
  var h = '<div class="card"><h2>'+esc(bl.title||'')+' <span class="muted" style="font-size:13px;font-weight:400">('+shown.length+(shown.length!==rows.length?' of '+rows.length:'')+')</span></h2>';
  if(bl.search || fcols.length){
    h += '<div class="tools">';
    if(bl.search) h += '<input placeholder="Search…" value="'+esc(st.q)+'" oninput="BSTATE[\''+sid(key)+'\'].q=this.value;BSTATE[\''+sid(key)+'\'].n=100;redrawSoon()">';
    fcols.forEach(function(c){
      var vals = []; rows.forEach(function(r){ var v = String(r[c.key]===undefined?'':r[c.key]); if(v && vals.indexOf(v)<0) vals.push(v); }); vals.sort();
      h += '<select onchange="BSTATE[\''+sid(key)+'\'].f[\''+sid(c.key)+'\']=this.value;redrawNow()"><option value="">All – '+esc(c.label)+'</option>'+vals.map(function(v){ return '<option'+(st.f[c.key]===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+'</select>';
    });
    h += '</div>';
  }
  if(!shown.length) return h+'<div class="muted">Nothing to show.</div></div>';
  var link = rows.some(function(r){ return r._link; });
  h += '<div class="scroll"><table><tr>'+bl.cols.map(function(c){ return '<th'+(c.align==='right'?' class="r"':'')+'>'+esc(c.label)+'</th>'; }).join('')+(link?'<th></th>':'')+'</tr>';
  shown.slice(0, st.n).forEach(function(r){
    h += '<tr class="'+(r._tone?'t-'+sid(r._tone):'')+'">'+bl.cols.map(function(c){ return '<td'+(c.align==='right'?' class="r"':'')+'>'+esc(tval(r[c.key], c.money))+'</td>'; }).join('')
      + (link?'<td>'+(r._link?'<a href="'+esc(r._link)+'" target="_blank" rel="noopener">'+esc(bl.linkLabel||'Open')+'</a>':'')+'</td>':'')+'</tr>';
  });
  h += '</table></div>';
  if(shown.length>st.n) h += '<button class="more" onclick="BSTATE[\''+sid(key)+'\'].n+=200;redrawNow()">Show more ('+(shown.length-st.n)+' left)</button>';
  return h+'</div>';
}
var RT = null;
function redrawSoon(){ clearTimeout(RT); RT = setTimeout(redrawNow, 350); }
function redrawNow(){
  var a = document.activeElement, val = a && a.tagName==='INPUT' ? { ph: a.placeholder, pos: a.selectionStart, idx: Array.prototype.indexOf.call(document.querySelectorAll('#boardArea input'), a) } : null;
  LASTBOARD = ''; var save = document.activeElement; if(save && save.blur) save.blur(); renderBoard(LAST_R);
  if(val && val.idx>=0){ var el = document.querySelectorAll('#boardArea input')[val.idx]; if(el){ el.focus(); try { el.setSelectionRange(val.pos, val.pos); } catch (e) {} } }
}
var COLORS = ['#2F5FC4','#DA2A2F','#157F3B','#B45309','#7C3AED'];
// A small trend line under a figure (the last days, today at the right).
function spark(v){
  if(!v || v.length<2) return '';
  var max = Math.max.apply(null, v), min = Math.min.apply(null, v.concat([0])); if(max===min) max = min+1;
  var W = 160, H = 30, pts = v.map(function(x, i){ return (i*(W-4)/(v.length-1)+2).toFixed(1)+','+(H-2-(x-min)/(max-min)*(H-4)).toFixed(1); });
  var last = pts[pts.length-1].split(',');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="var(--red)"/></svg>';
}
function barsBlock(bl){
  var labels = bl.labels||[], series = bl.series||[]; if(!labels.length || !series.length) return '';
  var max = 0, min = 0; series.forEach(function(sr){ sr.values.forEach(function(v){ max = Math.max(max, v||0); min = Math.min(min, v||0); }); });
  if(max===min) max = min+1;
  var W = 720, H = 220, L = 54, B = 34, T = 10, iw = W-L-10, ih = H-B-T, gw = iw/labels.length, bw = Math.max(2, Math.min(28, (gw-6)/series.length));
  var y = function(v){ return T + ih - (v-min)/(max-min)*ih; };
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(bl.title||'chart')+'">';
  [0, 0.5, 1].forEach(function(f){ var v = min+(max-min)*f, yy = y(v); svg += '<line x1="'+L+'" x2="'+(W-10)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(yy+4)+'" font-size="11" text-anchor="end" fill="var(--sub)">'+esc(bl.money?money(v).replace('.00',''):Math.round(v))+'</text>'; });
  if(min<0) svg += '<line x1="'+L+'" x2="'+(W-10)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--sub)"/>';
  labels.forEach(function(lab, i){
    series.forEach(function(sr, k){ var v = sr.values[i]||0, x = L + i*gw + (gw - bw*series.length)/2 + k*bw, y0 = y(Math.max(0, v)), h0 = Math.abs(y(v)-y(0));
      svg += '<rect x="'+x.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+(bw-1).toFixed(1)+'" height="'+Math.max(1,h0).toFixed(1)+'" rx="2" fill="'+(v<0?'var(--bad)':COLORS[k%COLORS.length])+'"><title>'+esc(sr.name+' · '+lab+': '+(bl.money?money(v):v))+'</title></rect>'; });
    if(labels.length<=16 || i%2===0) svg += '<text x="'+(L+i*gw+gw/2).toFixed(1)+'" y="'+(H-12)+'" font-size="10" text-anchor="middle" fill="var(--sub)">'+esc(lab)+'</text>';
  });
  svg += '</svg>';
  return '<div class="card bars"><h2>'+esc(bl.title||'')+'</h2>'+svg+(series.length>1?'<div class="legend">'+series.map(function(sr,k){ return '<span><i style="background:'+COLORS[k%COLORS.length]+'"></i>'+esc(sr.name)+'</span>'; }).join('')+'</div>':'')+'</div>';
}
